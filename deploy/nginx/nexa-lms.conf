# ==============================================================================
# Nexa Loan Management System - Nginx Production Configuration
# ==============================================================================
# Target: Ubuntu 22.04 / 24.04 LTS with Nginx 1.18+
# Copy to: /etc/nginx/sites-available/nexa-lms.conf
# Symlink to: /etc/nginx/sites-enabled/nexa-lms.conf
# Replace 'lms.yourdomain.com' with your fully qualified domain name (FQDN).
# ==============================================================================

# Rate Limiting Zones (DDoS & Brute-Force Protection)
limit_req_zone $binary_remote_addr zone=nexa_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=nexa_auth_limit:10m rate=10r/m;

# Upstream Backend Node.js / PM2 Process Cluster
upstream nexa_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server Block (Port 80) -> Force Redirect to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name lms.yourdomain.com;

    # Certbot ACME challenge directory for Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Permanent 301 redirect to HTTPS for all other requests
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server Block (Port 443) -> SSL/TLS & Reverse Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lms.yourdomain.com;

    # Web root directory (Contains compiled Vite static frontend assets)
    root /var/www/nexa-lms/dist;
    index index.html;

    # --------------------------------------------------------------------------
    # SSL/TLS Certificate Configuration (Managed via Let's Encrypt Certbot)
    # --------------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/lms.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lms.yourdomain.com/privkey.pem;

    # Modern TLS Protocols and Cipher Suites (Mozilla Modern Guidelines)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling for improved handshake performance and certificate validation
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/lms.yourdomain.com/chain.pem;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # Global HTTP Security Headers
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Maximum payload size for KYC identity documents & collateral uploads
    client_max_body_size 15M;

    # --------------------------------------------------------------------------
    # Gzip Compression Optimization
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Logging Configuration
    # --------------------------------------------------------------------------
    access_log /var/log/nginx/nexa-lms.access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/nexa-lms.error.log warn;

    # --------------------------------------------------------------------------
    # Static Assets & Long-Term Caching (/assets/*)
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Favicon and Manifest caching
    location ~* \.(?:ico|webmanifest|png|jpg|jpeg|gif|svg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Sensitive Auth Endpoint Reverse Proxy (Strict Rate Limiting)
    # --------------------------------------------------------------------------
    location ~ ^/api/(?:v1/)?auth/ {
        limit_req zone=nexa_auth_limit burst=5 nodelay;

        proxy_pass http://nexa_backend;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --------------------------------------------------------------------------
    # General API Reverse Proxy (/api/*)
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=nexa_api_limit burst=20 nodelay;

        proxy_pass http://nexa_backend;
        proxy_http_version 1.1;

        # Connection Keep-Alive and WebSockets Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # Single Page Application (SPA) Fallback Route
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        # Never cache index.html so frontend releases propagate immediately
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Deny direct access to backend bundle, config files, and hidden files
    location = /server.js {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:env|map|ts|cjs|sql|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
